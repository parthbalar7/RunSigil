{{- range $name, $component := .Values.components }}
---
apiVersion: v1
kind: Service
metadata:
  name: runsigil-{{ $name }}
  labels:
    {{- include "runsigil.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  selector:
    app.kubernetes.io/name: runsigil
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $name }}
  ports:
    - name: http
      port: {{ $component.port }}
      targetPort: http
{{- end }}

