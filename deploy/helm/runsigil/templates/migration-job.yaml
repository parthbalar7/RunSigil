{{- $image := .Values.images.migrator }}
{{- if not $image.digest }}{{ fail "images.migrator.digest must be an immutable sha256 digest" }}{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: runsigil-migration-{{ .Release.Revision }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: runsigil-migrator
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrator
          image: "{{ $image.repository }}@{{ $image.digest }}"
          command: ["alembic", "-c", "apps/control-api/alembic.ini", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: {{ .Values.global.existingSecret }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
