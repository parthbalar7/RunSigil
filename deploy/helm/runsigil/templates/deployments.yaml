{{- range $name, $component := .Values.components }}
{{- $image := index $.Values.images $component.image }}
{{- if not $image.digest }}
{{- fail (printf "images.%s.digest must be an immutable sha256 digest" $component.image) }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: runsigil-{{ $name }}
  labels:
    {{- include "runsigil.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ $component.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: runsigil
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: runsigil
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ $name }}
    spec:
      serviceAccountName: runsigil-{{ $name }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $name }}
          image: "{{ $image.repository }}@{{ $image.digest }}"
          imagePullPolicy: IfNotPresent
          {{- with $component.command }}
          {{- if . }}
          command: {{ toJson . }}
          {{- end }}
          {{- end }}
          envFrom:
            - secretRef:
                name: {{ $.Values.global.existingSecret }}
          ports:
            - name: http
              containerPort: {{ $component.port }}
          readinessProbe:
            httpGet:
              path: {{ $component.readinessPath }}
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
{{- end }}
