{{- range $name, $_ := .Values.components }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runsigil-{{ $name }}
  labels:
    {{- include "runsigil.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
automountServiceAccountToken: false
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runsigil-migrator
  labels:
    {{- include "runsigil.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrator
automountServiceAccountToken: false
