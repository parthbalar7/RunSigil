name: runsigil

x-python-service: &python-service
  build:
    context: ../..
    dockerfile: deploy/compose/Dockerfile.python
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  networks:
    - runsigil-control

services:
  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_DB: runsigil
      POSTGRES_USER: runsigil_owner
      POSTGRES_PASSWORD: ${RUNSIGIL_POSTGRES_OWNER_PASSWORD:?create root .env from .env.example}
      RUNSIGIL_POSTGRES_APP_PASSWORD: ${RUNSIGIL_POSTGRES_APP_PASSWORD:?create root .env from .env.example}
      RUNSIGIL_POSTGRES_WORKER_PASSWORD: ${RUNSIGIL_POSTGRES_WORKER_PASSWORD:?create root .env from .env.example}
      RUNSIGIL_POSTGRES_GATEWAY_AUTH_PASSWORD: ${RUNSIGIL_POSTGRES_GATEWAY_AUTH_PASSWORD:?create root .env from .env.example}
    volumes:
      - runsigil-postgres:/var/lib/postgresql/data
      - ./postgres/init-roles.sh:/docker-entrypoint-initdb.d/010-runsigil-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runsigil_owner -d runsigil"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:55432:5432"
    networks:
      - runsigil-control

  redis:
    image: redis:8.2.1-alpine@sha256:987c376c727652f99625c7d205a1cba3cb2c53b92b0b62aade2bd48ee1593232
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - runsigil-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - runsigil-control

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z@sha256:d249d1fb6966de4d8ad26c04754b545205ff15a62e4fd19ebd0f26fa5baacbc0
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${RUNSIGIL_OBJECT_STORE_ACCESS_KEY:?create root .env from .env.example}
      MINIO_ROOT_PASSWORD: ${RUNSIGIL_OBJECT_STORE_SECRET_KEY:?create root .env from .env.example}
    volumes:
      - runsigil-minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - runsigil-control

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.133.0@sha256:98274b756324abdb2473fa0c898247a246091e861e61d1548f9be483198eecea
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    networks:
      - runsigil-control

  migrator:
    <<: *python-service
    restart: "no"
    command: ["sh", "-c", "alembic -c apps/control-api/alembic.ini upgrade head && python -m runsigil_control_api.seed"]
    environment:
      RUNSIGIL_MIGRATION_DATABASE_URL: ${RUNSIGIL_MIGRATION_DATABASE_URL:?set the owner-only migration URL}
      RUNSIGIL_DEMO_PROVIDER_AUDIENCE: ${RUNSIGIL_DEMO_PROVIDER_AUDIENCE:-runsigil-demo-provider}
      RUNSIGIL_BOOTSTRAP_API_KEY: ${RUNSIGIL_BOOTSTRAP_API_KEY:?set a development bootstrap API key}
    depends_on:
      postgres:
        condition: service_healthy

  control-api:
    <<: *python-service
    image: ghcr.io/runsigil/control-api:0.2.0-local
    command: ["runsigil-api"]
    environment:
      RUNSIGIL_ENVIRONMENT: ${RUNSIGIL_ENVIRONMENT:-development}
      RUNSIGIL_DATABASE_URL: ${RUNSIGIL_DATABASE_URL:?set the app-role database URL}
      RUNSIGIL_GATEWAY_AUTHORIZATION_DATABASE_URL: ${RUNSIGIL_GATEWAY_AUTHORIZATION_DATABASE_URL:?set the gateway authorization database URL}
      RUNSIGIL_GATEWAY_SERVICE_TOKEN: ${RUNSIGIL_GATEWAY_SERVICE_TOKEN:?set the gateway service token}
      RUNSIGIL_ACTION_ENCRYPTION_KEY_B64: ${RUNSIGIL_ACTION_ENCRYPTION_KEY_B64:?set the action encryption key}
      RUNSIGIL_DEMO_PROVIDER_AUDIENCE: ${RUNSIGIL_DEMO_PROVIDER_AUDIENCE:-runsigil-demo-provider}
      RUNSIGIL_OTEL_ENABLED: "true"
      RUNSIGIL_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      migrator:
        condition: service_completed_successfully

  demo-provider:
    <<: *python-service
    command: ["uvicorn", "app:app", "--app-dir", "/app/examples/demo-provider", "--host", "0.0.0.0", "--port", "8090"]
    environment:
      RUNSIGIL_DEMO_PROVIDER_AUDIENCE: ${RUNSIGIL_DEMO_PROVIDER_AUDIENCE:-runsigil-demo-provider}
      RUNSIGIL_DEMO_PROVIDER_SIGNING_KEY: ${RUNSIGIL_DEMO_PROVIDER_SIGNING_KEY:?set the demo provider signing key}
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  gateway:
    <<: *python-service
    image: ghcr.io/runsigil/gateway:0.2.0-local
    command: ["runsigil-gateway"]
    environment:
      RUNSIGIL_ENVIRONMENT: ${RUNSIGIL_ENVIRONMENT:-development}
      RUNSIGIL_CONTROL_API_URL: ${RUNSIGIL_CONTROL_API_URL:-http://control-api:8000}
      RUNSIGIL_INTERNAL_SERVICE_TOKEN: ${RUNSIGIL_INTERNAL_SERVICE_TOKEN:?set the worker-to-gateway service token}
      RUNSIGIL_GATEWAY_SERVICE_TOKEN: ${RUNSIGIL_GATEWAY_SERVICE_TOKEN:?set the gateway-to-control service token}
      RUNSIGIL_DEMO_PROVIDER_URL: ${RUNSIGIL_DEMO_PROVIDER_URL:-http://demo-provider:8090/effects}
      RUNSIGIL_DEMO_PROVIDER_AUDIENCE: ${RUNSIGIL_DEMO_PROVIDER_AUDIENCE:-runsigil-demo-provider}
      RUNSIGIL_DEMO_PROVIDER_SIGNING_KEY: ${RUNSIGIL_DEMO_PROVIDER_SIGNING_KEY:?set the demo provider signing key}
      RUNSIGIL_ALLOW_PRIVATE_DEMO_PROVIDER: ${RUNSIGIL_ALLOW_PRIVATE_DEMO_PROVIDER:-false}
      RUNSIGIL_PROTOCOL_PUBLIC_BASE_URL: ${RUNSIGIL_PROTOCOL_PUBLIC_BASE_URL:-http://localhost:8080}
      RUNSIGIL_PROTOCOL_ALLOWED_ORIGINS: ${RUNSIGIL_PROTOCOL_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      RUNSIGIL_OTEL_ENABLED: "true"
      RUNSIGIL_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      control-api:
        condition: service_healthy
      demo-provider:
        condition: service_healthy

  worker:
    <<: *python-service
    image: ghcr.io/runsigil/worker:0.2.0-local
    command: ["runsigil-worker"]
    environment:
      RUNSIGIL_ENVIRONMENT: ${RUNSIGIL_ENVIRONMENT:-development}
      RUNSIGIL_WORKER_DATABASE_URL: ${RUNSIGIL_WORKER_DATABASE_URL:?set the worker-role database URL}
      RUNSIGIL_GATEWAY_URL: ${RUNSIGIL_GATEWAY_URL:-http://gateway:8080}
      RUNSIGIL_INTERNAL_SERVICE_TOKEN: ${RUNSIGIL_INTERNAL_SERVICE_TOKEN:?set the worker-to-gateway service token}
      RUNSIGIL_ACTION_ENCRYPTION_KEY_B64: ${RUNSIGIL_ACTION_ENCRYPTION_KEY_B64:?set the action encryption key}
      RUNSIGIL_EVIDENCE_ED25519_PRIVATE_KEY_B64: ${RUNSIGIL_EVIDENCE_ED25519_PRIVATE_KEY_B64:?set the evidence signing seed}
      RUNSIGIL_EVIDENCE_SIGNING_KEY_ID: ${RUNSIGIL_EVIDENCE_SIGNING_KEY_ID:-development-2026-01}
      RUNSIGIL_MAX_RECONCILIATION_ATTEMPTS: ${RUNSIGIL_MAX_RECONCILIATION_ATTEMPTS:-3}
      RUNSIGIL_MAX_DLQ_REDRIVES: ${RUNSIGIL_MAX_DLQ_REDRIVES:-2}
      RUNSIGIL_OTEL_ENABLED: "true"
      RUNSIGIL_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "8010:8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      gateway:
        condition: service_healthy

  web:
    image: ghcr.io/runsigil/web:0.2.0-local
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /var/cache/nginx:rw,noexec,nosuid,size=16m
      - /var/run:rw,noexec,nosuid,size=4m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "3000:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health | grep -q ok"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - runsigil-control

networks:
  runsigil-control:
    name: runsigil-control

volumes:
  runsigil-postgres:
  runsigil-redis:
  runsigil-minio:
